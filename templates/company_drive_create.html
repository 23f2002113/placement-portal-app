<!DOCTYPE html>
<html lang="en">

<head>
    <title>Create a Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
       #canvas{
        padding-top: 10px;
        padding-left: 10px;
       }
       #form-body{
        height: 550px;
        margin-top: 100px;
       }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h2>Create a Drive</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Drive Name</label><input type="text" class="form-control" id="name">
                    </div>
                    <div class="form-group">
                        <label for="title">Job Title</label><input type="text" class="form-control" id="title">
                    </div>
                    <div class="form-group">
                        <label for="description">Job Description</label><input type="text" class="form-control" id="description">
                    </div>
                    <div class="form-group">
                        <label for="criteria">Eligibility Criteria</label><input type="text" class="form-control" id="criteria">
                    </div>
                    <div class="form-group">
                        <label for="deadline">Application Deadline</label><input type="text" class="form-control" id="deadline">
                    </div>
                    <div class="text-right">
                        <input type="submit" class="btn-primary" value="Save">
                    </div>    
                </form>
            </div>
        </div>
    </div>
</body>
