<!DOCTYPE html>
<html lang="en">

<head>
    <title>Results Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Searching</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="/login">Log Out</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/student/{{ user_id }}">Go Back</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div id="content" style="padding-left: 30px;">
                <h3 style="padding-left: 30px;">Search results for "{{ search_word }}"</h3>
                {% if results %}
                <div id="table" class="border">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Drive Name</th>
                                <th>Company</th>
                                <th>Job Title</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for drive in results %}
                            <tr>
                                <td>{{ drive.drive_name }}</td>
                                <td>{{ drive.company.company_name }}</td>
                                <td>{{ drive.job_title }}</td>
                                <td>
                                    <a href="/student/drive/{{ drive.id }}?user_id={{ user_id }}" class="btn btn-primary btn-sm">View</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <h4 style="padding-left: 30px;">No results Found!</h4>
                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
