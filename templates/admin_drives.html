<!DOCTYPE html>
<html lang="en">

<head>
    <title>Current Drives</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
        #form-body {
            width: 400px;
        }
        a {
            font-size: 25px;
        }
        #content {
            padding: 20px;
        }

    </style>
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <h2>Drive {{drive.id}}</h1>
                </div>
                </nav>
                <div id="content">
                    <strong>Company Name:</strong> {{drive.company.company_name}}<br>
                    <br>
                    <strong>Job Title:</strong> {{drive.job_title}}<br>
                    <br>
                    <strong>Job Description:</strong>{{drive.job_description}}<br>
                    <br>
                    <strong>Salary:</strong> {{drive.salary_package}}<br>
                    <br>
                    <strong>Location:</strong> {{drive.location}}<br>
                    <br>
                    <div class="text-center">
                        <a href="/admin" class="'btn btn-primary"> Go Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
