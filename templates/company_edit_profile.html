<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit Company Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
       #form-body{
        margin-top: 120px;
       } 
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h2>Edit Profile</h2>
                <form action="/company/{{ company.user_id }}/edit_profile" method="POST">
                    <div class="form-group">
                        <label for="name">Company Name</label>
                        <input type="text" id="name" name="company_name" class="form-control" value="{{ company.company_name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="website">Website </label>
                        <input type="url" id="website" name="website" class="form-control" value="{{ company.website }}" >
                    </div>
                    <div class="form-group">
                        <label for="contact">HR Contact Number</label>
                        <input type="text" id="contact" name="hr_contact" class="form-control" value="{{ company.hr_contact }}" >
                    </div>
                    <div class="text-right">
                        <a href="/company/{{ company.user_id }}" class="btn btn-secondary">Back</a>
                        <input type="submit" class="btn btn-primary" value="Save Profile">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
