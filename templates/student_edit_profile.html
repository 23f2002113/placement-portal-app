<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit Student Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
       #form-body{
        margin-top: 50px;
       } 
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h2>Edit Profile</h2>
                <form action="/student/{{student.user_id}}/profile" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" name="student_name" class="form-control" value="{{ student.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="dp">Department </label>
                        <input type="text" id="dp" name="department" class="form-control" value="{{ student.department }}" >
                    </div>
                    <div class="form-group">
                        <label for="rollno">Roll No.</label>
                        <input type="text" id="rollno" name="roll_no" class="form-control" value="{{ student.roll_no }}" >
                    </div>
                    <div class="form-group">
                        <label for="cgpa">CGPA</label>
                        <input type="number" step="0.01" id="cgpa" name="cgpa" class="form-control" value="{{ student.cgpa }}" >
                    </div>
                    <div class="form-group">
                        <label for="resume">Upload Resume</label>
                        <input type="file" id="resume" name="resume" class="form-control-file" >
                        
                        {% if student.resume_link %}
                        <small class="text-muted">Current Resume: 
                            <a href="/static/uploads/resumes/{{ student.resume_link }}" target="_blank">View File</a>
                        </small>
                        {% endif %}
                    </div>
                    <div class="text-right">
                        <a href="/student/{{ student.user_id }}" class="btn btn-secondary">Back</a>
                        <input type="submit" class="btn btn-primary" value="Save Profile">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
