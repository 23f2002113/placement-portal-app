<!DOCTYPE html> 
<html lang="en">

<head>
    <title> Admin Student Application</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
        #form-body {
            margin-top: 150px;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h2>Student Application</h2>
                <div id="content1">
                    <strong>Student Name:</strong> {{application.student.name}} <br>
                    <br>
                    <strong>Department:</strong> {{application.student.department}} <br>
                    <br>
                    <strong>Drive:</strong> {{application.drive.id}} <br>
                    <br>
                    <strong>Job Title:</strong> {{application.drive.job_title}}<br>
                    <br>
                    <div class="container-fluid">
                        <a href="/static/uploads/resumes/{{application.student.resume_link}}" class="btn btn-info" target="_blank">View Resume</a>
                        <div class="btn-group">
                            <a href="/admin" class="btn btn-info">Back</a>
                        </div>
                    </div>
                </div>  
            </div>
        </div>
    </div>
</body>

</html>
