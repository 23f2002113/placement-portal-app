<!DOCTYPE html>
<html lang="en">

<head>
    <title>Company</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <h2>{{company.company_name}}</h2>
                    <a href="/student/{{ student_user_id }}" class="btn btn-secondary">Back to dashboard</a>
                </div>
            </nav>
            <div id="content1">
                <h2>Overview</h2>
                <p style="margin: 30px;">{{ company.website }} <br> Contact: {{ company.hr_contact }}</p>
            </div>
            <div id="content2">
                <h2>Current Drives</h2>
                <table class="table">
                    {% for drive in drives %}
                    <tr>
                        <td>{{ drive.drive_name }}</td>
                        <td>{{ drive.job_title }}</td>
                        <td>
                            <a href="/student/drive/{{ drive.id }}?user_id={{ student_user_id }}"
                                class="btn btn-primary">View Details & Apply</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center">No Current Drives.</td>
                    </tr>

                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
</body>

</html>
